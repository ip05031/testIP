<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Orden de Compra - FacturaSnap</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

    <style>
        body { background-color: #0f0f0f; color: #e0e0e0; font-family: 'Segoe UI', sans-serif; }
        .card { border: none; border-radius: 12px; background: #1e1e1e; margin-bottom: 1.5rem; }
        .header-app { border-bottom: 2px solid #0dcaf0; padding-bottom: 10px; margin-bottom: 25px; }
        .form-control, .form-select { background-color: #2a2a2a; border: 1px solid #444; color: #fff; font-size: 16px; }
        .form-control:focus, .form-select:focus { border-color: #0dcaf0; box-shadow: none; background-color: #333; color: #fff; }
        .table-responsive { border-radius: 12px; background: #1e1e1e; padding: 15px; }
        .total-row { background-color: #161616; font-size: 1.2rem; color: #0dcaf0; }
        input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(1); }
        label { color: #0dcaf0; font-weight: 500; margin-bottom: 4px; }
    </style>
</head>

<body class="p-2 p-md-4">

    <div class="container-fluid">
        <div class="header-app d-flex justify-content-between align-items-center">
            <h2 class="m-0">
                <a href="index.html" class="text-decoration-none text-white">
                    <i class="fas fa-arrow-left me-2 fs-4 text-info"></i>
                </a>Registro de Orden de Compra
            </h2>
            <span class="badge bg-info text-dark">Módulo de Adquisiciones</span>
        </div>

        <div class="row g-4">
            <div class="col-xl-4 col-lg-5">
                <form id="facturaForm">
                    <div class="card p-3 shadow border-warning">
                        <h5 class="text-info mb-3 border-bottom pb-2">Información General</h5>
                        <div class="row g-2">
                            <div class="col-6 mb-2">
                                <label class="small fw-bold">Orden de Compra</label>
                                <input type="text" id="oc" class="form-control" readonly required>
                            </div>
                            <div class="col-6 mb-2">
                                <label class="small fw-bold">Fecha Emisión</label>
                                <input type="date" id="fecha" class="form-control" required>
                            </div>

                            <div class="col-6 mb-2 oculto">
                                <label class="small fw-bold">Vencimiento <span
                                        class="label-db">[fecha_vencimiento]</span></label>
                                <input type="date" id="fecha_vencimiento" class="form-control" readonly>
                            </div>
                            <div class="col-6 mb-2 oculto">
                                <label class="small fw-bold">Aprobación <span
                                        class="label-db">[fecha_aprobacion]</span></label>
                                <input type="text" id="fecha_aprobacion" class="form-control" value="null" readonly>
                            </div>

                            <div class="col-12 mb-2">
                                <label class="small fw-bold">Proyecto</label>
                                <select id="select_proyecto" class="form-select" required>
                                    <option value="">Seleccione proyecto...</option>
                                </select>
                            </div>
                            <div class="col-12 mb-2">
                                <label class="small fw-bold">Proveedor</label>
                                <select id="select_proveedor" class="form-select" required>
                                    <option value="">Seleccione proveedor...</option>
                                </select>
                                <small id="termino_pago_hint" class="text-warning d-block mt-1"
                                    style="font-size: 0.75rem;"></small>
                            </div>
                            <div class="col-12 mb-2">
                                <label class="small fw-bold">Dirección de Entrega</label>
                                <input type="text" id="direccion" class="form-control" required>
                            </div>
                            <div class="col-12 mb-2">
                                <label class="small fw-bold">Factura / DTE</label>
                                <input type="text" id="numeroFactura" class="form-control" placeholder="Ej: DTE-123">
                            </div>
                            <input type="hidden" id="estado" value="Pendiente">
                            <input type="hidden" id="registrado_por" value="Norma Rodríguez">
                        </div>
                    </div>

                    <div class="card p-3 shadow border-info">
                        <h5 class="text-info mb-3 border-bottom pb-2">Agregar Artículo</h5>
                        <div class="row g-2">
                            <div class="col-4">
                                <label class="small">Cant.</label>
                                <input type="number" id="tempQty" class="form-control" value="1" min="1">
                            </div>
                            <div class="col-8">
                                <label class="small">Item (Buscar o Digitar)</label>
                                <input list="itemsDataList" id="tempItem" class="form-control" placeholder="Escriba código...">
                                <datalist id="itemsDataList"></datalist>
                            </div>
                            <div class="col-12">
                                <label class="small">Descripción</label>
                                <textarea id="tempDesc" class="form-control" rows="2"></textarea>
                            </div>
                            <div class="col-12">
                                <label class="small">Costo Unitario ($)</label>
                                <input type="number" id="tempCost" class="form-control" step="0.01">
                            </div>
                            <div class="col-12 d-flex gap-2">
                                <button type="button" id="btnAddItem" class="btn btn-info w-75 fw-bold mt-3">+ AÑADIR</button>
                                <button type="button" id="btnApplyIVA" class="btn btn-outline-warning w-25 fw-bold mt-3">+ IVA</button>
                            </div>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-success w-100 py-3 fw-bold">GUARDAR Y GENERAR PDF</button>
                </form>
            </div>

            <div class="col-xl-8 col-lg-7">
                <div class="card p-3 shadow">
                    <h5 class="text-info mb-3">Resumen de la Orden</h5>
                    <div class="table-responsive">
                        <table class="table table-dark align-middle">
                            <thead>
                                <tr>
                                    <th>Cant.</th>
                                    <th>Item</th>
                                    <th>Descripción</th>
                                    <th>Costo</th>
                                    <th>Subtotal</th>
                                    <th>Acción</th>
                                </tr>
                            </thead>
                            <tbody id="itemsBody"></tbody>
                            <tfoot>
                                <tr class="total-row">
                                    <td colspan="4" class="text-end fw-bold">TOTAL GENERAL:</td>
                                    <td colspan="2" class="fw-bold" id="totalGeneralLabel">$0.00</td>
                                </tr>
                            </tfoot>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="ordenCompra.js"></script>

    <script>
        // Configuración de Supabase
        const _supabase = supabase.createClient('https://kcamvogialgzhtnztink.supabase.co', 'sb_publishable_KDacU7ubY2lYE6BAVvhOmA_qe1XUR2s');
        let listaArticulos = [];

        async function init() {
            $('#fecha').val(new Date().toISOString().split('T')[0]);
            await obtenerSiguienteOC();
            await cargarCatalogos();
        }

        async function obtenerSiguienteOC() {
            const { data } = await _supabase.from('ordenes_compra').select('numero_orden').order('numero_orden', { ascending: false }).limit(1);
            let siguiente = (data && data.length > 0) ? parseInt(data[0].numero_orden) + 1 : 1;
            $('#oc').val(siguiente.toString().padStart(4, '0'));
        }

        async function cargarCatalogos() {
            const { data: provs } = await _supabase.from('proveedores').select('id, nombre_comercial, direccion');
            provs?.forEach(p => $('#select_proveedor').append(`<option value="${p.id}" data-dir="${p.direccion}">${p.nombre_comercial}</option>`));

            const { data: proys } = await _supabase.from('proyectos').select('id, nombre_proyecto');
            proys?.forEach(p => $('#select_proyecto').append(`<option value="${p.id}">${p.nombre_proyecto}</option>`));

            const { data: items } = await _supabase.from('items').select('id, codigo_item, nombre_item');
            items?.forEach(i => {
                $('#itemsDataList').append(`<option value="${i.codigo_item}" data-id="${i.id}">${i.nombre_item}</option>`);
            });
        }

        $('#select_proveedor').on('change', function () {
            const dir = $(this).find(':selected').data('dir');
            if (dir) $('#direccion').val(dir);
        });

        $('#tempItem').on('input', function() {
            const val = $(this).val();
            const option = $(`#itemsDataList option[value='${val}']`);
            if(option.length > 0) {
                $('#tempDesc').val(option.text());
            }
        });

        $('#btnAddItem').on('click', function () {
            const qty = parseFloat($('#tempQty').val());
            const item = $('#tempItem').val().trim();
            const desc = $('#tempDesc').val().trim();
            const cost = parseFloat($('#tempCost').val());
            const itemId = $(`#itemsDataList option[value='${item}']`).data('id') || null;

            if (!item || isNaN(qty) || isNaN(cost)) return alert("Complete los datos del artículo.");

            listaArticulos.push({ qty, item, desc, cost, amount: qty * cost, itemId });
            renderizarTabla();
            $('#tempItem').val(''); $('#tempDesc').val(''); $('#tempCost').val(''); $('#tempQty').val(1);
        });

        $('#btnApplyIVA').on('click', function () {
            if (listaArticulos.length === 0) return;
            let subtotal = listaArticulos.reduce((acc, a) => acc + (a.item !== 'IVA' ? a.amount : 0), 0);
            const valorIVA = subtotal * 0.13;
            listaArticulos.push({ qty: 1, item: 'IVA', desc: 'IVA COMPRA (13%)', cost: valorIVA, amount: valorIVA, itemId: 1 });
            renderizarTabla();
        });

        function renderizarTabla() {
            let html = '', total = 0;
            listaArticulos.forEach((art, i) => {
                total += art.amount;
                html += `<tr>
                    <td>${art.qty}</td>
                    <td><span class="badge border border-info text-info">${art.item}</span></td>
                    <td>${art.desc}</td>
                    <td>$${art.cost.toFixed(2)}</td>
                    <td>$${art.amount.toFixed(2)}</td>
                    <td><button type="button" class="btn btn-outline-danger btn-sm" onclick="eliminarItem(${i})"><i class="fas fa-trash"></i></button></td>
                </tr>`;
            });
            $('#itemsBody').html(html);
            $('#totalGeneralLabel').text(`$${total.toFixed(2)}`);
        }

        window.eliminarItem = (index) => { listaArticulos.splice(index, 1); renderizarTabla(); };

        // LÓGICA DE GUARDADO CORREGIDA
        $('#facturaForm').on('submit', async function (e) {
            e.preventDefault();
            if (listaArticulos.length === 0) return alert("La lista está vacía.");

            const totalNum = parseFloat($('#totalGeneralLabel').text().replace('$', ''));
            const numOC = parseInt($('#oc').val());

            // 1. Guardar Cabecera y obtener el ID REAL generado por Supabase
            const cabecera = {
                numero_orden: numOC,
                fecha: $('#fecha').val(),
                proveedor_id: parseInt($('#select_proveedor').val()),
                proyecto_id: parseInt($('#select_proyecto').val()),
                total: totalNum,
                estado: $('#estado').val(),
                fecha_vencimiento: $('#fecha').val(),
                registrado_por: $('#registrado_por').val(),
                numero_factura_dte: $('#numeroFactura').val()
            };

            // Insertamos y pedimos el registro de vuelta con .select().single()
            const { data: ordenCreada, error: errorCabecera } = await _supabase
                .from('ordenes_compra')
                .insert([cabecera])
                .select()
                .single();

            if (errorCabecera) {
                console.error("Error al guardar cabecera:", errorCabecera);
                return alert("Error cabecera: " + errorCabecera.message);
            }

            // El ID que genera la base de datos es el que necesitamos para el detalle
            const idDeLaOrdenEnBD = ordenCreada.id;

            // 2. Guardar Detalle usando el ID obtenido arriba
            const detalles = listaArticulos.map(art => ({
                orden_id: idDeLaOrdenEnBD, // Vínculo con la Foreign Key real
                cantidad: art.qty,
                codigo_item: art.item,
                descripcion: art.desc,
                costo_unitario: art.cost,
                subtotal: art.amount,
                item_id: art.itemId
            }));

            const { error: errorDetalle } = await _supabase.from('detalle_orden').insert(detalles);

            if (errorDetalle) {
                console.error("Error al guardar detalles:", errorDetalle);
                alert("Error en detalles: " + errorDetalle.message);
            } else {

                const infoPDF = {
                    oc: $('#oc').val(),
                    fecha: $('#fecha').val(),
                    proveedor: $('#select_proveedor option:selected').text(),
                    direccion: $('#direccion').val(),
                    goodThru: $('#fecha_vencimiento').val(),
                    terms: $('#select_proveedor option:selected').data('termino') || "Net 30 Days"
                };

                if (typeof generarPDF === 'function') {
                    generarPDF(listaArticulos, infoPDF, $('#totalGeneralLabel').text());
                    alert("¡Orden Guardada!");
                    location.reload();
                }

                //alert("¡Orden #" + numOC + " guardada exitosamente!");
                //location.reload();
            }
        });

        $(document).ready(init);
    </script>
</body>
</html>
