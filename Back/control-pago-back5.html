<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Pagos - FacturaSnap</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

    <style>
        body { background-color: #0f0f0f; color: #e0e0e0; font-family: 'Segoe UI', sans-serif; }
        .card { border: none; border-radius: 12px; background: #1e1e1e; margin-bottom: 1.5rem; }
        .header-app { border-bottom: 2px solid #0dcaf0; padding-bottom: 10px; margin-bottom: 25px; }
        .table { background-color: #1e1e1e; color: #e0e0e0; }
        .table-hover tbody tr { cursor: pointer; }
        .table-hover tbody tr:hover { background-color: #2a2a2a; }
        .status-badge { font-size: 0.8rem; padding: 5px 10px; border-radius: 20px; font-weight: bold; }
        .text-vencido { color: #ff4d4d !important; font-weight: bold; }
        .form-control, .form-select { background-color: #2a2a2a; border: 1px solid #444; color: #fff; }
        .form-control:focus, .form-select:focus { background-color: #333; color: #fff; border-color: #0dcaf0; box-shadow: none; }
        input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(1); }
        
        .dropzone-area {
            border: 2px dashed #444;
            border-radius: 8px;
            padding: 25px;
            text-align: center;
            background: #252525;
            cursor: pointer;
            transition: border-color 0.3s;
        }
        .dropzone-area:hover { border-color: #0dcaf0; }
        
        .offcanvas { 
            background-color: #151515; 
            width: 100% !important; 
            max-width: 550px; 
            border-left: 1px solid #2d2d2d; 
            max-height: 100vh;
            overflow-y: auto;
        }
        .offcanvas-header { border-bottom: 1px solid #2d2d2d; background-color: #1a1a1a; }
        
        .info-block {
            background-color: #1e1e1e;
            border: 1px solid #2d2d2d;
            border-radius: 8px;
            padding: 12px;
        }
        .info-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #888888;
            margin-bottom: 2px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .info-label i {
            color: #0dcaf0;
            width: 14px;
        }
        .info-value {
            font-size: 0.95rem;
            color: #ffffff;
            font-weight: 500;
        }

        .table-panel-container {
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #2d2d2d;
        }
        .table-panel {
            font-size: 0.88rem;
            margin-bottom: 0;
        }
        .table-panel thead th {
            background-color: #222222 !important;
            color: #0dcaf0 !important;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 10px 12px;
            border-bottom: 1px solid #2d2d2d;
        }
        .table-panel tbody td {
            padding: 10px 12px;
            background-color: #1a1a1a;
            border-bottom: 1px solid #252525;
        }
        .table-panel tbody tr:last-child td {
            border-bottom: none;
        }
    </style>
</head>

<body class="p-2 p-md-4">

    <div class="container-fluid">
        <div class="header-app d-flex justify-content-between align-items-center">
            <h2 class="m-0">
                <a href="index.html" class="text-decoration-none text-white">
                    <i class="fas fa-arrow-left me-2 fs-4 text-info"></i>
                </a>Control de Pagos
            </h2>
        </div>

        <div class="card shadow mb-4">
            <div class="card-body">
                <form id="filterForm" class="row g-3 align-items-end">
                    <div class="col-md-2">
                        <label class="small fw-bold text-info">Desde:</label>
                        <input type="date" id="filterDesde" class="form-control">
                    </div>
                    <div class="col-md-2">
                        <label class="small fw-bold text-info">Hasta:</label>
                        <input type="date" id="filterHasta" class="form-control">
                    </div>
                    <div class="col-md-2">
                        <label class="small fw-bold text-info">Proyecto:</label>
                        <select id="filterProyecto" class="form-select">
                            <option value="">Todos los proyectos</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label class="small fw-bold text-info">Proveedor:</label>
                        <select id="filterProveedor" class="form-select">
                            <option value="">Todos los proveedores</option>
                        </select>
                    </div>
                    <div class="col-md-3 d-flex gap-1">
                        <button type="submit" class="btn btn-info w-100 fw-bold">
                            <i class="fas fa-filter"></i> Filtrar
                        </button>
                        <button type="button" id="btnExportExcel" class="btn btn-success" title="Exportar lo filtrado a Excel">
                            <i class="fas fa-file-excel"></i>
                        </button>
                        <button type="button" id="btnReset" class="btn btn-outline-secondary">
                            <i class="fas fa-undo"></i>
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <div class="card shadow">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0" id="tablaPagosPrincipal">
                        <thead class="table-dark">
                            <tr>
                                <th>Proyecto</th>
                                <th>Proveedor</th>
                                <th>Descripción</th>
                                <th>Total OC</th>
                                <th class="text-success">Abonado</th>
                                <th class="text-warning">Pendiente</th>
                                <th>DTE / Factura</th>
                                <th>Emisión</th>
                                <th>Vencimiento</th>
                                <th class="text-center">Estado</th>
                            </tr>
                        </thead>
                        <tbody id="pagosBody">
                            <tr>
                                <td colspan="10" class="text-center p-4">Cargando información...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <div class="offcanvas offcanvas-end" tabindex="-1" id="panelDetalle" aria-labelledby="panelDetalleLabel">
        <div id="panelContentWrapper"></div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

    <script>
        const _supabase = supabase.createClient('https://kcamvogialgzhtnztink.supabase.co', 'sb_publishable_KDacU7ubY2lYE6BAVvhOmA_qe1XUR2s');

        let bsOffcanvas;
        let ordenesCache = []; 
        let archivosCargados = [];

        const fmtF = (f) => f ? f.split('-').reverse().join('/') : '-';
        const fmtM = (m) => Number(m).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

        async function cargarCatalogos() {
            try {
                const [resProy, resProv] = await Promise.all([
                    _supabase.from('proyectos').select('id, nombre_proyecto').order('nombre_proyecto'),
                    _supabase.from('proveedores').select('id, nombre_comercial').order('nombre_comercial')
                ]);

                resProy.data?.forEach(p => $('#filterProyecto').append(`<option value="${p.id}">${p.nombre_proyecto}</option>`));
                resProv.data?.forEach(p => $('#filterProveedor').append(`<option value="${p.id}">${p.nombre_comercial}</option>`));
            } catch (err) {
                console.error("Error cargando catálogos:", err);
            }
        }

        async function cargarPagos(filtros = {}) {
            $('#pagosBody').html('<tr><td colspan="10" class="text-center p-4">Buscando registros...</td></tr>');

            // Apuntamos a la vista calculada dinámicamente
            let query = _supabase
                .from('v_control_pagos')
                .select('*');

            if (filtros.desde) query = query.gte('fecha', filtros.desde);
            if (filtros.hasta) query = query.lte('fecha', filtros.hasta);
            if (filtros.proyecto) query = query.eq('proyecto_id', filtros.proyecto);
            if (filtros.proveedor) query = query.eq('proveedor_id', filtros.proveedor);

            query = query.order('fecha', { ascending: false });

            const { data, error } = await query;

            if (error) {
                $('#pagosBody').html(`<tr><td colspan="10" class="text-center text-danger p-4">Error: ${error.message}</td></tr>`);
                return;
            }

            ordenesCache = data || [];
            renderizarTabla(ordenesCache);
        }

        function renderizarTabla(data) {
            let html = '';
            const hoy = new Date().toISOString().split('T')[0];

            if (!data || data.length === 0) {
                html = '<tr><td colspan="10" class="text-center p-4">No se encontraron resultados</td></tr>';
            } else {
                data.forEach(p => {
                    const esVencido = p.monto_pendiente > 0 && p.fecha_vencimiento < hoy;

                    // Manejo dinámico de estados visuales
                    let badgeClass = 'bg-secondary';
                    let estadoVisual = p.estado;

                    if (p.monto_pendiente <= 0) {
                        badgeClass = 'bg-success';
                        estadoVisual = 'Pagado';
                    } else if (p.monto_pagado > 0 && p.monto_pendiente > 0) {
                        badgeClass = 'bg-info text-dark';
                        estadoVisual = 'Abocado / Parcial';
                    } else {
                        badgeClass = 'bg-warning text-dark';
                        estadoVisual = 'Pendiente';
                    }

                    html += `
                        <tr onclick="verDetalleOrden(${p.id})">
                            <td><small class="fw-bold text-info">${p.proyecto_nombre || 'N/A'}</small></td>
                            <td>${p.proveedor_nombre || 'N/A'}</td>
                            <td><small class="text-secondary">${p.descripcion || 'Sin descripción'}</small></td>
                            <td class="fw-medium">$${fmtM(p.monto_total)}</td>
                            <td class="fw-bold text-success">$${fmtM(p.monto_pagado)}</td>
                            <td class="fw-bold text-warning">$${fmtM(p.monto_pendiente)}</td>
                            <td class="font-monospace small text-warning">${p.numero_factura_dte || '---'}</td>
                            <td>${fmtF(p.fecha)}</td>
                            <td class="${esVencido ? 'text-vencido' : ''}">
                                ${fmtF(p.fecha_vencimiento)} 
                                ${esVencido ? '<i class="fas fa-exclamation-triangle ms-1" title="Orden vencida sin pagar"></i>' : ''}
                            </td>
                            <td class="text-center"><span class="status-badge ${badgeClass}">${estadoVisual}</span></td>
                        </tr>`;
                });
            }
            $('#pagosBody').html(html);
        }

        async function verDetalleOrden(id) {
            const orden = ordenesCache.find(o => o.id === id);
            if (!orden) return;

            let numStr = orden.numero_orden ? orden.numero_orden.toString().replace(/\D/g, '') : '000';
            let poLabel = `PO - ${numStr.padStart(3, '0')}`;

            let htmlPanel = `
                <div class="offcanvas-header">
                    <h5 class="offcanvas-title fw-bold text-info" id="panelDetalleLabel">
                        <i class="fas fa-file-invoice-dollar me-2"></i>Detalle orden ${poLabel}
                    </h5>
                    <button type="button" class="btn-close text-reset" data-bs-dismiss="offcanvas" aria-label="Close"></button>
                </div>
                <div class="offcanvas-body">
                    <div class="d-flex gap-2 mb-4">
                        ${orden.monto_pendiente > 0 ? 
                            `<button class="btn btn-success w-50 fw-bold" onclick="abrirFormularioPago(${orden.id})">
                                <i class="fas fa-money-bill-wave me-2"></i> Abonar / Pagar
                             </button>` : 
                            `<button class="btn btn-outline-success w-50 fw-bold" disabled>
                                <i class="fas fa-check-circle me-2"></i> Total Cancelado
                             </button>`
                        }
                        <button class="btn btn-info w-50 fw-bold text-white" onclick="abrirSeccionDocumentos(${orden.id})">
                            <i class="fas fa-folder-open me-2"></i> Documentos
                        </button>
                    </div>

                    <h6 class="text-info text-uppercase small fw-bold mb-3 d-flex align-items-center gap-1">
                        <i class="fas fa-info-circle"></i> Balance de Flujo
                    </h6>
                    <div class="row g-2 mb-4">
                        <div class="col-4">
                            <div class="info-block border-secondary text-center">
                                <div class="info-label justify-content-center">Total Orden</div>
                                <div class="info-value font-monospace fw-bold text-white">$${fmtM(orden.monto_total)}</div>
                            </div>
                        </div>
                        <div class="col-4">
                            <div class="info-block border-success text-center">
                                <div class="info-label justify-content-center text-success">Total Pagado</div>
                                <div class="info-value font-monospace fw-bold text-success">$${fmtM(orden.monto_pagado)}</div>
                            </div>
                        </div>
                        <div class="col-4">
                            <div class="info-block border-warning text-center">
                                <div class="info-label justify-content-center text-warning">Pendiente</div>
                                <div class="info-value font-monospace fw-bold text-warning">$${fmtM(orden.monto_pendiente)}</div>
                            </div>
                        </div>
                    </div>

                    <h6 class="text-info text-uppercase small fw-bold mb-3 d-flex align-items-center gap-1">
                        <i class="fas fa-info-circle"></i> Información General
                    </h6>
                    
                    <div class="row g-2 mb-4">
                        <div class="col-12">
                            <div class="info-block">
                                <div class="info-label"><i class="fas fa-project-diagram"></i> Proyecto asignado</div>
                                <div class="info-value text-info fw-bold">${orden.proyecto_nombre || 'N/A'}</div>
                            </div>
                        </div>
                        <div class="col-12">
                            <div class="info-block">
                                <div class="info-label"><i class="fas fa-truck"></i> Proveedor</div>
                                <div class="info-value">${orden.proveedor_nombre || 'N/A'}</div>
                            </div>
                        </div>
                        <div class="col-6">
                            <div class="info-block">
                                <div class="info-label"><i class="fas fa-calendar-alt"></i> Emisión</div>
                                <div class="info-value">${fmtF(orden.fecha)}</div>
                            </div>
                        </div>
                        <div class="col-6">
                            <div class="info-block">
                                <div class="info-label"><i class="fas fa-calendar-check"></i> Vencimiento</div>
                                <div class="info-value">${fmtF(orden.fecha_vencimiento)}</div>
                            </div>
                        </div>
                        <div class="col-6">
                            <div class="info-block">
                                <div class="info-label"><i class="fas fa-receipt"></i> Registro DTE / Factura</div>
                                <div class="info-value font-monospace small text-warning">${orden.numero_factura_dte || '---'}</div>
                            </div>
                        </div>
                        <div class="col-6">
                            <div class="info-block">
                                <div class="info-label"><i class="fas fa-clock"></i> Periodo</div>
                                <div class="info-value">${orden.periodo || '---'}</div>
                            </div>
                        </div>
                    </div>

                    <h6 class="text-info text-uppercase small fw-bold mb-3 d-flex align-items-center gap-1">
                        <i class="fas fa-history"></i> Historial de Abonos Realizados
                    </h6>
                    <div class="table-responsive table-panel-container mb-4">
                        <table class="table table-dark table-panel align-middle">
                            <thead>
                                <tr>
                                    <th>Fecha</th>
                                    <th>Notas</th>
                                    <th class="text-end">Monto Abonado</th>
                                </tr>
                            </thead>
                            <tbody id="historialAbonosBody">
                                <tr>
                                    <td colspan="3" class="text-center text-secondary py-2"><i class="fas fa-spinner fa-spin me-2"></i>Buscando abonos...</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                    
                    <h6 class="text-info text-uppercase small fw-bold mb-3 d-flex align-items-center gap-1">
                        <i class="fas fa-th-list"></i> Detalle de Ítems Solicitados
                    </h6>
                    <div class="table-responsive table-panel-container mb-3">
                        <table class="table table-dark table-panel align-middle">
                            <thead>
                                <tr>
                                    <th style="width: 50%;">Descripción / Item</th>
                                    <th style="width: 15%;" class="text-center">Cant.</th>
                                    <th style="width: 15%;" class="text-end">P. Unit</th>
                                    <th style="width: 20%;" class="text-end">Subtotal</th>
                                </tr>
                            </thead>
                            <tbody id="itemsOrdenBody">
                                <tr><td colspan="4" class="text-center text-secondary py-4"><i class="fas fa-spinner fa-spin me-2"></i> Leyendo ítems...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>`;

            $('#panelContentWrapper').html(htmlPanel);
            bsOffcanvas.show();

            // Carga paralela de ítems e historial de abonos reales
            try {
                _supabase.from('detalle_orden').select('descripcion, cantidad, costo_unitario, subtotal').eq('orden_id', id)
                    .then(({ data: detalles }) => {
                        let htmlItems = '';
                        if (!detalles || detalles.length === 0) {
                            htmlItems = '<tr><td colspan="4" class="text-center text-muted py-3">Sin ítems registrados</td></tr>';
                        } else {
                            detalles.forEach(d => {
                                htmlItems += `
                                    <tr>
                                        <td><span class="text-white fw-medium d-block" style="font-size: 0.85rem;">${d.descripcion || 'Sin descripción'}</span></td>
                                        <td class="text-center text-secondary fw-bold">${d.cantidad}</td>
                                        <td class="text-end text-muted font-monospace">$${fmtM(d.costo_unitario)}</td>
                                        <td class="text-end text-info fw-bold font-monospace">$${fmtM(d.subtotal)}</td>
                                    </tr>`;
                            });
                        }
                        $('#itemsOrdenBody').html(htmlItems);
                    });

                _supabase.from('pagos_orden').select('fecha_pago, notas, monto_pagado').eq('orden_id', id).order('fecha_pago', { ascending: true })
                    .then(({ data: abonos }) => {
                        let htmlAbonos = '';
                        if (!abonos || abonos.length === 0) {
                            htmlAbonos = '<tr><td colspan="3" class="text-center text-muted py-3">No hay abonos registrados para esta orden.</td></tr>';
                        } else {
                            abonos.forEach(a => {
                                const soloFecha = a.fecha_pago ? a.fecha_pago.split('T')[0] : '';
                                htmlAbonos += `
                                    <tr>
                                        <td>${fmtF(soloFecha)}</td>
                                        <td><small class="text-secondary">${a.notas || ''}</small></td>
                                        <td class="text-end text-success fw-bold font-monospace">$${fmtM(a.monto_pagado)}</td>
                                    </tr>`;
                            });
                        }
                        $('#historialAbonosBody').html(htmlAbonos);
                    });

            } catch (err) {
                console.error("Error consultando dependencias:", err);
            }
        }

        function abrirFormularioPago(id) {
            const orden = ordenesCache.find(o => o.id === id);
            if (!orden) return;

            let numStr = orden.numero_orden ? orden.numero_orden.toString().replace(/\D/g, '') : '000';
            let poLabel = `PO - ${numStr.padStart(3, '0')}`;

            let htmlFormulario = `
                <div class="offcanvas-header">
                    <h5 class="offcanvas-title fw-bold text-success" id="panelDetalleLabel">Registrar Abono: ${poLabel}</h5>
                    <button type="button" class="btn-close text-reset" data-bs-dismiss="offcanvas" aria-label="Close"></button>
                </div>
                <div class="offcanvas-body">
                    <form id="paymentForm" onsubmit="procesarFormularioPago(event, ${orden.id}, '${numStr.padStart(3, '0')}')">
                        <div class="mb-3">
                            <label class="small fw-bold text-secondary">Monto Pendiente Actual:</label>
                            <input type="text" class="form-control fw-bold text-warning fs-5" id="txtSaldoPendiente" value="$${fmtM(orden.monto_pendiente)}" readonly>
                        </div>

                        <div class="mb-3">
                            <label class="small fw-bold text-info">Monto a Abonar ($):</label>
                            <input type="number" step="0.01" min="0.01" max="${orden.monto_pendiente}" class="form-control form-control-lg text-white fw-bold" id="numMontoAbono" value="${orden.monto_pendiente}" required>
                            <div class="form-text text-muted">Puedes modificar este monto para realizar un pago parcial.</div>
                        </div>

                        <div class="mb-3">
                            <label class="small fw-bold text-info">Adjuntar Comprobante de Pago (Opcional):</label>
                            <input type="file" id="fileComprobantePago" class="form-control" accept=".pdf,image/*">
                            <div class="form-text text-muted">Sube el PDF de transferencia o captura del cheque.</div>
                        </div>

                        <div class="mb-3">
                            <label class="small fw-bold text-info">Notas / Comentarios del Abono:</label>
                            <input type="text" class="form-control" id="txtNotasPago" placeholder="Ej. Pago parcial por transferencia bancaria">
                        </div>

                        <div class="d-flex gap-2 mt-4">
                            <button type="button" class="btn btn-outline-secondary w-50" onclick="verDetalleOrden(${orden.id})">
                                <i class="fas fa-chevron-left"></i> Volver
                            </button>
                            <button type="submit" id="btnGuardarAbono" class="btn btn-success w-50 fw-bold">
                                Confirmar Abono
                            </button>
                        </div>
                    </form>
                </div>`;

            $('#panelContentWrapper').html(htmlFormulario);
        }

        async function procesarFormularioPago(e, id, numeroOrdenStr) {
            e.preventDefault();
            
            const $btn = $('#btnGuardarAbono');
            const montoAbono = parseFloat($('#numMontoAbono').val());
            const notas = $('#txtNotasPago').val() || 'Abono a orden de compra';
            const fileInput = document.getElementById('fileComprobantePago');

            if (isNaN(montoAbono) || montoAbono <= 0) {
                alert("Por favor introduce un monto válido.");
                return;
            }

            // Deshabilitar botón para mitigar duplicidad transaccional
            $btn.prop('disabled', true).text('Procesando...');

            try {
                // 1. Guardar la transacción del abono en pagos_orden
                const { error: errorPago } = await _supabase.from('pagos_orden').insert([
                    {
                        orden_id: id,
                        monto_pagado: montoAbono,
                        //notes: notas, // Mapeado a notas según estructura previa
                        notas: notas,
                        fecha_pago: new Date().toISOString(),
                        registrado_por: 'Norma Rodriguez' 
                    }
                ]);

                if (errorPago) throw new Error("Error guardando el abono: " + errorPago.message);

                // 2. Si se adjuntó un documento, procesar subida al Storage y su tracking en documentos_orden
                if (fileInput && fileInput.files.length > 0) {
                    const archivoComprobante = fileInput.files[0];
                    const nombreArchivoOriginal = archivoComprobante.name;
                    // Generación de la ruta usando la estructura de la PO correspondiente
                    const rutaStorage = `pagos/PO_${numeroOrdenStr}/${Date.now()}_${nombreArchivoOriginal}`;

                    // Subida al bucket físico 'documentos_compras' de Supabase
                    const { error: errorUpload } = await _supabase.storage
                        .from('documentos_compras')
                        .upload(rutaStorage, archivoComprobante, { cacheControl: '3600', upsert: true });

                    if (errorUpload) throw new Error("Error en Storage (Comprobante): " + errorUpload.message);

                    // 3. Vincular el archivo subido en la tabla de metadata general 'documentos_orden'
                    const { error: errorDocumento } = await _supabase
                        .from('documentos_orden')
                        .insert([
                            {
                                orden_id: id,
                                tipo_documento: 'comprobante_pago',
                                ruta_storage: `documentos_compras/${rutaStorage}`
                            }
                        ]);

                    if (errorDocumento) throw new Error("Error guardando registro en documentos_orden: " + errorDocumento.message);
                }

                alert("¡Abono y documentación registrados con éxito!");
                bsOffcanvas.hide();
                
                // Recargar con los filtros actuales de la interfaz
                const filtros = {
                    desde: $('#filterDesde').val(),
                    hasta: $('#filterHasta').val(),
                    proyecto: $('#filterProyecto').val(),
                    proveedor: $('#filterProveedor').val()
                };
                cargarPagos(filtros);

            } catch (err) {
                alert(err.message);
                console.error(err);
                $btn.prop('disabled', false).text('Confirmar Abono');
            }
        }

        async function abrirSeccionDocumentos(id) {
            const orden = ordenesCache.find(o => o.id === id);
            if (!orden) return;

            let numStr = orden.numero_orden ? orden.numero_orden.toString().replace(/\D/g, '') : '000';
            let poLabel = `PO - ${numStr.padStart(3, '0')}`;

            let htmlDocs = `
                <div class="offcanvas-header">
                    <h5 class="offcanvas-title fw-bold text-info" id="panelDetalleLabel"><i class="fas fa-file-invoice me-2"></i>Documentos: ${poLabel}</h5>
                    <button type="button" class="btn-close text-reset" data-bs-dismiss="offcanvas" aria-label="Close"></button>
                </div>
                <div class="offcanvas-body d-flex flex-column justify-content-between">
                    <div>
                        <h6 class="text-secondary text-uppercase small fw-bold mb-3">Archivos Vinculados de la Orden</h6>
                        <div id="listaDocumentosDB" class="mb-4">
                            <div class="text-center p-3 text-secondary"><i class="fas fa-spinner fa-spin me-1"></i> Buscando expedientes...</div>
                        </div>
                        <hr class="border-secondary my-4">
                        <h6 class="text-secondary text-uppercase small fw-bold mb-2">Cargar Nuevo Documento</h6>
                        <div class="mb-3">
                            <label class="small text-muted mb-1">Tipo de Documento:</label>
                            <select id="tipoDocumentoCarga" class="form-select form-select-sm">
                                <option value="DTE / Factura Electrónica">DTE / Factura Electrónica</option>
                                <option value="Comprobante de Transferencia">Comprobante de Transferencia</option>
                                <option value="Nota de Remisión">Nota de Remisión</option>
                                <option value="Otros">Otros</option>
                            </select>
                        </div>
                        <div class="dropzone-area mb-2" onclick="$('#fileInput').click()">
                            <i class="fas fa-cloud-upload-alt text-info fs-4 mb-2"></i>
                            <p class="mb-0 small text-secondary">Presiona para examinar o arrastra el documento</p>
                            <input type="file" id="fileInput" multiple class="d-none" onchange="manejarArchivos(this.files)">
                        </div>
                        <ul class="list-group list-group-flush" id="listaArchivosNuevos"></ul>
                    </div>
                    <div class="d-flex gap-2 mt-4">
                        <button type="button" class="btn btn-outline-secondary w-100" onclick="verDetalleOrden(${orden.id})">
                            <i class="fas fa-chevron-left me-1"></i> Regresar al Detalle
                        </button>
                    </div>
                </div>`;

            $('#panelContentWrapper').html(htmlDocs);
            archivosCargados = [];

            try {
                const { data: docs, error } = await _supabase
                    .from('documentos_orden')
                    .select('id, tipo_documento, ruta_storage, created_at')
                    .eq('orden_id', id);

                if (error) throw error;

                let htmlLista = '<div class="list-group">';
                if (!docs || docs.length === 0) {
                    htmlLista += `
                        <div class="text-center p-4 bg-dark rounded border border-secondary text-muted">
                            <i class="fas fa-folder-open fs-4 d-block mb-2"></i>
                            <small>No hay documentos anexados todavía</small>
                        </div>`;
                } else {
                    docs.forEach(d => {
                        htmlLista += `
                            <div class="list-group-item bg-transparent border-secondary text-white d-flex justify-content-between align-items-center p-2">
                                <div class="text-truncate me-2">
                                    <span class="d-block small fw-bold text-info">${d.tipo_documento}</span>
                                    <span class="text-secondary" style="font-size:0.75rem;"><i class="fas fa-paperclip me-1"></i>${d.ruta_storage.split('/').pop()}</span>
                                </div>
                                <a href="#" class="btn btn-sm btn-outline-info border-0" title="Ver documento"><i class="fas fa-external-link-alt"></i></a>
                            </div>`;
                    });
                }
                htmlLista += '</div>';
                $('#listaDocumentosDB').html(htmlLista);

            } catch (err) {
                console.error("Error consultando documentos_orden:", err);
                $('#listaDocumentosDB').html('<div class="alert alert-danger small">Error al conectar con el repositorio de documentos.</div>');
            }
        }

        function manejarArchivos(files) {
            let tipo = $('#tipoDocumentoCarga').val();
            for (let file of files) {
                archivosCargados.push({ name: file.name, tipo: tipo });
            }
            actualizarListaArchivosNuevos();
        }

        function actualizarListaArchivosNuevos() {
            let listHtml = '';
            archivosCargados.forEach((doc, index) => {
                listHtml += `
                    <li class="list-group-item bg-transparent text-white border-secondary p-1 d-flex justify-content-between align-items-center small">
                        <span class="text-truncate"><i class="fas fa-file-alt text-warning me-2"></i>[${doc.tipo}] ${doc.name}</span>
                        <button type="button" class="btn btn-sm text-danger p-0 ms-2" onclick="eliminarArchivoTemp(${index})"><i class="fas fa-times"></i></button>
                    </li>`;
            });
            $('#listaArchivosNuevos').html(listHtml);
        }

        function eliminarArchivoTemp(index) {
            archivosCargados.splice(index, 1);
            actualizarListaArchivosNuevos();
        }

        $('#btnExportExcel').on('click', function() {
            if (ordenesCache.length === 0 || $('#pagosBody tr td').length <= 1) {
                alert("No hay registros en la tabla para exportar.");
                return;
            }
            const tableElement = document.getElementById('tablaPagosPrincipal');
            const wb = XLSX.utils.table_to_book(tableElement, { sheet: "Control de Pagos" });
            XLSX.writeFile(wb, "Control_de_Pagos.xlsx");
        });

        $('#filterForm').on('submit', function (e) {
            e.preventDefault();
            const filtros = {
                desde: $('#filterDesde').val(),
                hasta: $('#filterHasta').val(),
                proyecto: $('#filterProyecto').val(),
                proveedor: $('#filterProveedor').val()
            };
            cargarPagos(filtros);
        });

        $('#btnReset').on('click', function () {
            $('#filterForm')[0].reset();
            cargarPagos();
        });

        $(document).ready(() => {
            bsOffcanvas = new bootstrap.Offcanvas(document.getElementById('panelDetalle'));
            cargarCatalogos();
            cargarPagos();
        });
    </script>
</body>
</html>
