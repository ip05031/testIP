<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proveedores - FacturaSnap</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    
    <style>
        body { background-color: #0f0f0f; color: #e0e0e0; font-family: 'Segoe UI', sans-serif; }
        .card { border: none; border-radius: 12px; background: #1e1e1e; margin-bottom: 1.5rem; }
        .header-app { border-bottom: 2px solid #0dcaf0; padding-bottom: 10px; margin-bottom: 25px; }
        .form-control, .form-select { background-color: #2a2a2a; border: 1px solid #444; color: #fff; }
        .form-control:focus, .form-select:focus { background-color: #333; border-color: #0dcaf0; color: #fff; box-shadow: none; }
        .table-responsive { border-radius: 12px; background: #1e1e1e; padding: 15px; }
        label { color: #0dcaf0; font-weight: 500; margin-bottom: 4px; }
    </style>
</head>
<body class="p-2 p-md-4">

<div class="container-fluid">
    <div class="header-app d-flex justify-content-between align-items-center">
        <h2 class="m-0"><a href="index.html" class="text-decoration-none text-white"><i class="fas fa-arrow-left me-2 fs-4 text-info"></i></a>Proveedores</h2>
        <span class="badge bg-info text-dark">Maestro de Datos</span>
    </div>

    <div class="row g-4">
        <div class="col-xl-4 col-lg-5">
            <div class="card p-3 shadow">
                <h5 class="text-info mb-3 border-bottom pb-2" id="formTitle">Nuevo Proveedor</h5>
                <form id="proveedorForm">
                    <!-- Campo oculto para el ID al editar -->
                    <input type="hidden" id="proveedor_id">

                    <div class="mb-3">
                        <label class="small">Nombre Comercial</label>
                        <input type="text" id="nombre_comercial" class="form-control" placeholder="Ej. Ferretería El Clavo" required>
                    </div>
                    <div class="mb-3">
                        <label class="small">Razón Social</label>
                        <input type="text" id="razon_social" class="form-control" placeholder="Nombre legal completo">
                    </div>
                    
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="small">NIT</label>
                            <input type="text" id="nrc_nit" class="form-control" placeholder="0000-000000-000-0">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="small">NRC</label>
                            <input type="text" id="nrc" class="form-control" placeholder="Registro Contribuyente">
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="small">Dirección</label>
                        <input type="text" id="direccion" class="form-control" placeholder="Ubicación física">
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="small">Teléfono</label>
                            <input type="text" id="numerotelefono" class="form-control" placeholder="2200-0000">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="small">Email</label>
                            <input type="email" id="email" class="form-control" placeholder="correo@proveedor.com">
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="small">Términos de Pago</label>
                        <select id="terminos_pago" class="form-select">
                            <option value="Contado">Contado</option>
                            <option value="Net 30 days" selected>Net 30 days</option>
                            <option value="Net 60 days">Net 60 days</option>
                        </select>
                    </div>

                    <div class="d-flex gap-2">
                        <button type="submit" id="btnSubmit" class="btn btn-info w-100 fw-bold mt-2">
                            <i class="fas fa-save me-2"></i>GUARDAR
                        </button>
                        <button type="button" id="btnCancelar" class="btn btn-outline-secondary w-50 fw-bold mt-2 d-none">
                            CANCELAR
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <div class="col-xl-8 col-lg-7">
            <div class="card p-3 shadow">
                <h5 class="text-info mb-3">Listado Registrado</h5>
                <div class="table-responsive">
                    <table class="table table-dark table-hover align-middle" id="tablaProveedores">
                        <thead>
                            <tr>
                                <th>Nombre Comercial</th>
                                <th>NIT / NRC</th>
                                <th>Contacto</th>
                                <th class="text-center">Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="proveedoresBody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    const _supabase = supabase.createClient('https://kcamvogialgzhtnztink.supabase.co', 'sb_publishable_KDacU7ubY2lYE6BAVvhOmA_qe1XUR2s');

    async function cargarProveedores() {
        const { data, error } = await _supabase
            .from('proveedores')
            .select('*')
            .order('nombre_comercial', { ascending: true });
            
        if (error) return console.error("Error:", error.message);
        
        let html = '';
        data.forEach(p => {
            html += `
                <tr>
                    <td>
                        <div class="fw-bold text-info">${p.nombre_comercial}</div>
                        <small class="text-secondary">${p.razon_social || ''}</small>
                    </td>
                    <td>
                        <div class="small">NIT: ${p.nrc_nit || 'N/A'}</div>
                        <div class="small">NRC: ${p.nrc || 'N/A'}</div>
                    </td>
                    <td>
                        <div class="small"><i class="fas fa-phone me-1"></i>${p.numerotelefono || '-'}</div>
                        <div class="small"><i class="fas fa-envelope me-1"></i>${p.email || '-'}</div>
                    </td>
                    <td class="text-center">
                        <div class="btn-group">
                            <button class="btn btn-outline-warning btn-sm" onclick='prepararEdicion(${JSON.stringify(p)})'>
                                <i class="fas fa-edit"></i>
                            </button>
                            <button class="btn btn-outline-danger btn-sm" onclick="eliminarProveedor(${p.id})">
                                <i class="fas fa-trash"></i>
                            </button>
                        </div>
                    </td>
                </tr>`;
        });
        $('#proveedoresBody').html(html || '<tr><td colspan="4" class="text-center text-secondary">No hay proveedores registrados</td></tr>');
    }

    $('#proveedorForm').on('submit', async function(e) {
        e.preventDefault();
        
        const id = $('#proveedor_id').val();
        const datos = {
            nombre_comercial: $('#nombre_comercial').val(),
            razon_social: $('#razon_social').val(),
            nrc_nit: $('#nrc_nit').val(),
            nrc: $('#nrc').val(),
            direccion: $('#direccion').val(),
            numerotelefono: $('#numerotelefono').val(),
            email: $('#email').val(),
            terminos_pago: $('#terminos_pago').val()
        };

        let result;
        if (id) {
            result = await _supabase.from('proveedores').update(datos).eq('id', id);
        } else {
            result = await _supabase.from('proveedores').insert([datos]);
        }
        
        if (result.error) {
            alert("Error al guardar: " + result.error.message);
        } else {
            alert(id ? "Proveedor actualizado" : "Proveedor guardado");
            cancelarEdicion();
            cargarProveedores();
        }
    });

    window.prepararEdicion = (p) => {
        $('#proveedor_id').val(p.id);
        $('#nombre_comercial').val(p.nombre_comercial);
        $('#razon_social').val(p.razon_social);
        $('#nrc_nit').val(p.nrc_nit);
        $('#nrc').val(p.nrc);
        $('#direccion').val(p.direccion);
        $('#numerotelefono').val(p.numerotelefono);
        $('#email').val(p.email);
        $('#terminos_pago').val(p.terminos_pago);

        $('#formTitle').html('<i class="fas fa-edit me-2"></i>Editar Proveedor');
        $('#btnSubmit').removeClass('btn-info').addClass('btn-warning').html('<i class="fas fa-sync me-2"></i>ACTUALIZAR');
        $('#btnCancelar').removeClass('d-none');
    };

    function cancelarEdicion() {
        $('#proveedorForm')[0].reset();
        $('#proveedor_id').val('');
        $('#formTitle').html('Nuevo Proveedor');
        $('#btnSubmit').removeClass('btn-warning').addClass('btn-info').html('<i class="fas fa-save me-2"></i>GUARDAR PROVEEDOR');
        $('#btnCancelar').addClass('d-none');
    }

    $('#btnCancelar').on('click', cancelarEdicion);

    async function eliminarProveedor(id) {
        if(confirm('¿Está seguro de eliminar este proveedor?')) {
            const { error } = await _supabase.from('proveedores').delete().eq('id', id);
            if (error) alert("Error: " + error.message);
            else cargarProveedores();
        }
    }

    $(document).ready(cargarProveedores);
</script>
</body>
</html>
