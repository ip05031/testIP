<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - FacturaSnap Pro</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { 
            background-color: #0f0f0f; 
            color: #e0e0e0; 
            font-family: 'Segoe UI', sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card-login { 
            border: none; 
            border-radius: 12px; 
            background: #1e1e1e; 
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .header-login { 
            border-bottom: 2px solid #0dcaf0; 
            padding-bottom: 15px; 
            margin-bottom: 25px; 
            text-align: center;
        }
        .form-control { 
            background-color: #2a2a2a; 
            border: 1px solid #444; 
            color: #fff; 
            padding: 12px;
        }
        .form-control:focus {
            background-color: #333;
            border-color: #0dcaf0;
            color: #fff;
            box-shadow: 0 0 0 0.25rem rgba(13, 202, 240, 0.25);
        }
        .btn-login {
            background-color: #0dcaf0;
            border: none;
            color: #000;
            font-weight: bold;
            padding: 12px;
            transition: all 0.3s;
        }
        .btn-login:hover {
            background-color: #0baccc;
            transform: translateY(-2px);
        }
        .footer-text {
            color: #888;
            font-size: 0.85rem;
            text-align: center;
            margin-top: 20px;
        }
    </style>
</head>
<body>

<div class="container p-3">
    <div class="card-login p-4 p-md-5 mx-auto">
        <div class="header-login">
            <h2 class="m-0">FacturaSnap <span class="text-info">v3.2</span></h2>
            <small class="text-secondary">Acceso al Sistema</small>
        </div>

        <form id="loginForm">
            <div class="mb-3">
                <label class="form-label small text-info">Correo Electrónico</label>
                <input type="email" id="email" class="form-control" placeholder="nombre@empresa.com" required>
            </div>
            
            <div class="mb-4">
                <label class="form-label small text-info">Contraseña</label>
                <input type="password" id="password" class="form-control" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn btn-login w-100 shadow">
                INICIAR SESIÓN
            </button>
        </form>

        <div class="footer-text">
            &copy; 2026 FECO, S.A. DE C.V. <br>
            <span class="text-info">Control de Órdenes y Pagos</span>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    const _supabase = supabase.createClient('https://kcamvogialgzhtnztink.supabase.co', 'sb_publishable_KDacU7ubY2lYE6BAVvhOmA_qe1XUR2s');

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;

        const { data, error } = await _supabase.auth.signInWithPassword({
            email: email,
            password: password,
        });

        if (error) {
            alert("Error de acceso: " + error.message);
        } else {
            // Guardamos el usuario y redirigimos
            window.location.href = 'index.html'; 
        }
    });
</script>

</body>
</html>
