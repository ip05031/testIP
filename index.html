<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FacturaSnap Pro - Sistema de Órdenes</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.datatables.net/1.13.7/css/dataTables.bootstrap5.min.css" rel="stylesheet">
    
    <style>
        body { background-color: #121212; color: #e0e0e0; font-family: 'Segoe UI', sans-serif; }
        .card { border: none; border-radius: 15px; background: #1e1e1e; box-shadow: 0 8px 32px rgba(0,0,0,0.5); }
        .table-container { padding: 20px; background: #1e1e1e; border-radius: 15px; }
        .btn-info { background-color: #0dcaf0; border: none; color: #000; font-weight: bold; }
        .form-control, .form-select { background-color: #2a2a2a; border: 1px solid #444; color: #fff; }
        .form-control:focus { background-color: #333; color: #fff; border-color: #0dcaf0; box-shadow: none; }
        .form-control:read-only { background-color: #1a1a1a; color: #0dcaf0; }
        /* Estilo para que el icono del calendario sea visible en modo oscuro */
        input[type="date"]::-webkit-calendar-picker-indicator {
            filter: invert(1);
        }
    </style>
</head>
<body class="p-3 p-md-4">

<div class="container-fluid">
    <div class="header-app d-flex justify-content-between align-items-center mb-4">
        <h2>FacturaSnap <span class="text-info">v3.1</span></h2>
        <span class="badge bg-info text-dark">Edición Calendario</span>
    </div>

    <form id="facturaForm">
        <div class="row g-4">
            <div class="col-xl-4">
                <div class="card p-4">
                    <h4 class="mb-4 text-info">Información General</h4>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Purchase Order No.</label>
                            <input type="text" id="oc" class="form-control" placeholder="PC-001" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Date Issued</label>
                            <input type="date" id="fecha" class="form-control" required>
                        </div>
                        <div class="col-md-12 mb-3">
                            <label class="form-label">Proveedor (Nombre)</label>
                            <input type="text" id="proveedor" class="form-control" required>
                        </div>
                        <div class="col-md-12 mb-3">
                            <label class="form-label">Dirección</label>
                            <input type="text" id="direccion" class="form-control" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">País</label>
                            <input type="text" id="pais" class="form-control" value="EL SALVADOR" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Good Thru</label>
                            <input type="text" id="goodThru" class="form-control" readonly>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Ship Via</label>
                            <input type="text" id="shipVia" class="form-control" value="Airborne">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Terms</label>
                            <input type="text" id="terms" class="form-control" value="Net 30 days">
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-xl-8">
                <div class="card p-4 h-100">
                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <h4 class="text-info m-0">Detalles de la Orden</h4>
                        <button type="button" id="btnAddItem" class="btn btn-sm btn-outline-info">+ Agregar Artículo</button>
                    </div>
                    
                    <div class="table-responsive">
                        <table class="table table-dark align-middle" id="itemsTable">
                            <thead>
                                <tr>
                                    <th style="width: 10%;">Qty</th>
                                    <th style="width: 15%;">Item</th>
                                    <th>Description</th>
                                    <th style="width: 15%;">Unit Cost</th>
                                    <th style="width: 15%;">Amount</th>
                                    <th style="width: 5%;"></th>
                                </tr>
                            </thead>
                            <tbody id="itemsBody"></tbody>
                            <tfoot>
                                <tr>
                                    <td colspan="4" class="text-end fw-bold pt-3">TOTAL GENERAL:</td>
                                    <td class="pt-3"><input type="text" id="totalGeneral" class="form-control fw-bold text-info" value="$0.00" readonly></td>
                                    <td></td>
                                </tr>
                            </tfoot>
                        </table>
                    </div>
                    <div class="mt-auto pt-4">
                        <button type="submit" class="btn btn-info w-100 py-3">GENERAR Y GUARDAR ORDEN</button>
                    </div>
                </div>
            </div>
        </div>
    </form>

    <div class="row mt-5">
        <div class="col-12">
            <div class="table-container shadow">
                <h4 class="mb-4 text-secondary">Historial de Órdenes</h4>
                <table id="tablaFacturas" class="table table-dark table-hover w-100">
                    <thead>
                        <tr>
                            <th>OC #</th>
                            <th>Proveedor</th>
                            <th>Monto Total</th>
                            <th>Fecha Emisión</th>
                            <th>Vence</th>
                            <th class="text-center">Acciones</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
<script src="https://cdn.datatables.net/1.13.7/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/1.13.7/js/dataTables.bootstrap5.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script>
$(document).ready(function() {
    const table = $('#tablaFacturas').DataTable({
        language: { url: '//cdn.datatables.net/plug-ins/1.13.11/i18n/es-ES.json' },
        order: [[3, 'desc']]
    });

    // Función para manejar las fechas
    function actualizarFechas(fechaBase = null) {
        let fechaEmision = fechaBase ? new Date(fechaBase) : new Date();
        
        // Ajustar desfase de zona horaria si viene del input date
        if (fechaBase) fechaEmision.setMinutes(fechaEmision.getMinutes() + fechaEmision.getTimezoneOffset());

        // Formato para el input HTML (yyyy-mm-dd)
        const yyyy = fechaEmision.getFullYear();
        const mm = String(fechaEmision.getMonth() + 1).padStart(2, '0');
        const dd = String(fechaEmision.getDate()).padStart(2, '0');
        
        if (!fechaBase) $('#fecha').val(`${yyyy}-${mm}-${dd}`);

        // Calcular Good Thru (+1 mes)
        let fechaVence = new Date(fechaEmision);
        fechaVence.setMonth(fechaVence.getMonth() + 1);
        
        const formatEs = (d) => d.toLocaleDateString('es-ES', { day: '2-digit', month: '2-digit', year: 'numeric' });
        $('#goodThru').val(formatEs(fechaVence));
    }

    // Inicializar fechas
    actualizarFechas();

    // Evento cuando el usuario cambia la fecha manualmente
    $('#fecha').on('change', function() {
        actualizarFechas($(this).val());
    });

    function addItemRow() {
        const row = `
            <tr class="item-row">
                <td><input type="number" class="form-control qty" value="1" min="1"></td>
                <td><input type="text" class="form-control item-code" placeholder="Cód"></td>
                <td><input type="text" class="form-control desc" placeholder="Descripción"></td>
                <td><input type="number" class="form-control ucost" step="0.01" value="0.00"></td>
                <td><input type="text" class="form-control row-amount" value="0.00" readonly></td>
                <td><button type="button" class="btn btn-outline-danger btn-sm remove-row">×</button></td>
            </tr>`;
        $('#itemsBody').append(row);
    }

    function calculateTotals() {
        let total = 0;
        $('.item-row').each(function() {
            const qty = parseFloat($(this).find('.qty').val()) || 0;
            const cost = parseFloat($(this).find('.ucost').val()) || 0;
            const amount = qty * cost;
            $(this).find('.row-amount').val(amount.toFixed(2));
            total += amount;
        });
        $('#totalGeneral').val('$' + total.toFixed(2));
    }

    addItemRow();

    $('#btnAddItem').click(addItemRow);
    $(document).on('click', '.remove-row', function() {
        $(this).closest('tr').remove();
        calculateTotals();
    });
    $(document).on('input', '.qty, .ucost', calculateTotals);

    $('#facturaForm').on('submit', function(e) {
        e.preventDefault();
        
        const items = [];
        $('.item-row').each(function() {
            items.push({
                qty: $(this).find('.qty').val(),
                item: $(this).find('.item-code').val(),
                desc: $(this).find('.desc').val(),
                cost: $(this).find('.ucost').val(),
                amount: $(this).find('.row-amount').val()
            });
        });

        const fechaRaw = $('#fecha').val().split('-');
        const fechaFormateada = `${fechaRaw[2]}/${fechaRaw[1]}/${fechaRaw[0]}`;

        const fila = [
            $('#oc').val(),
            $('#proveedor').val(),
            `<span class="text-info fw-bold">${$('#totalGeneral').val()}</span>`,
            fechaFormateada,
            $('#goodThru').val(),
            `<button class="btn btn-sm btn-info btn-pdf-historial">📄 PDF</button>
             <button class="btn btn-sm btn-outline-danger btn-borrar">×</button>`
        ];

        table.row.add(fila).draw();
        generarPDF(items, fechaFormateada);
        
        this.reset();
        $('#itemsBody').empty();
        actualizarFechas();
        addItemRow();
        calculateTotals();
    });

    function generarPDF(items, fechaDoc) {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();
        
        doc.setFontSize(10).setFont("helvetica", "bold").text("ORDERED BY:", 20, 20);
        doc.setFontSize(14).text("FECO, S.A. DE C.V.", 20, 28);
        doc.setFontSize(9).setFont("helvetica", "normal")
           .text("Av. Lamatepec y Calle Chaparr.\n#3, Urb. Ind Sta Elena, Antiguo Cuscatlan\nEl Salvador", 20, 33);
        
        doc.setFontSize(26).setTextColor(76, 145, 105).text("PURCHASE ORDER", 110, 30);
        
        doc.setFontSize(10).setTextColor(0).setFont("helvetica", "bold");
        doc.text(`P.O. NO: ${$('#oc').val()}`, 110, 45);
        doc.text(`DATE: ${fechaDoc}`, 110, 50);
        doc.text(`GOOD THRU: ${$('#goodThru').val()}`, 110, 55);

        doc.setFillColor(240, 240, 240).rect(20, 65, 80, 25, 'F');
        doc.text("TO:", 22, 70);
        doc.setFont("helvetica", "normal").text(`${$('#proveedor').val()}\n${$('#direccion').val()}\n${$('#pais').val()}`, 22, 75);

        let y = 100;
        doc.setFillColor(76, 145, 105).rect(20, y, 170, 8, 'F');
        doc.setTextColor(255).text("Qty", 22, y+5).text("Item", 40, y+5).text("Description", 70, y+5).text("Cost", 145, y+5).text("Amount", 170, y+5);
        
        doc.setTextColor(0);
        y += 12;
        items.forEach(item => {
            doc.text(item.qty, 22, y);
            doc.text(item.item, 40, y);
            doc.text(doc.splitTextToSize(item.desc, 70), 70, y);
            doc.text(`$${item.cost}`, 145, y);
            doc.text(`$${item.amount}`, 170, y);
            y += 8;
        });

        doc.line(20, y, 190, y);
        doc.setFont("helvetica", "bold").text("TOTAL GENERAL:", 130, y + 10);
        doc.text($('#totalGeneral').val(), 170, y + 10);

        doc.save(`OC_${$('#oc').val()}.pdf`);
    }

    $('#tablaFacturas').on('click', '.btn-borrar', function() {
        table.row($(this).parents('tr')).remove().draw();
    });
});
</script>
</body>
</html>
