<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Perfil - FacturaSnap</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    
    <style>
        body { background-color: #0f0f0f; color: #e0e0e0; font-family: 'Segoe UI', sans-serif; }
        .card { border: none; border-radius: 12px; background: #1e1e1e; margin-bottom: 1.5rem; }
        .header-app { border-bottom: 2px solid #0dcaf0; padding-bottom: 10px; margin-bottom: 25px; }
        .form-control { background-color: #2a2a2a; border: 1px solid #444; color: #fff; }
        .form-control:focus { border-color: #0dcaf0; box-shadow: none; color: #fff; background-color: #333; }
        label { color: #0dcaf0; font-weight: 500; margin-bottom: 4px; }
        .form-control[readonly] { background-color: #1a1a1a; border-color: #333; color: #aaa; cursor: not-allowed; }
    </style>
</head>
<body class="p-2 p-md-4">

<div class="container-fluid">
    <div class="header-app d-flex justify-content-between align-items-center">
        <h2 class="m-0">
            <a href="index.html" class="text-decoration-none text-white">
                <i class="fas fa-arrow-left me-2 fs-4 text-info"></i>
            </a>Mi Perfil
        </h2>
        <span class="badge bg-info text-dark">Ajustes de Usuario</span>
    </div>

    <div class="row g-4 justify-content-center">
        <div class="col-xl-6 col-lg-8 col-md-10 col-sm-12">
            <div class="card p-3 shadow">
                <form id="profileForm">
                    
                    <!-- SECCIÓN 1: Información Personal -->
                    <h5 class="text-info mb-3 border-bottom pb-2">
                        <i class="fas fa-user me-2"></i>Información Personal
                    </h5>
                    
                    <div class="mb-3">
                        <label class="small">Nombre Completo</label>
                        <input type="text" id="user_display_name" class="form-control" placeholder="Ej. Juan Pérez" required>
                    </div>

                    <div class="mb-3">
                        <label class="small">Correo Electrónico</label>
                        <input type="email" id="user_email" class="form-control" placeholder="correo@ejemplo.com" required>
                        <div class="form-text text-muted small">Nota: Si cambias el correo, Supabase requerirá confirmación en ambas direcciones.</div>
                    </div>

                    <div class="mb-3">
                        <label class="small">Rol (Descripción)</label>
                        <input type="text" id="user_role" class="form-control" readonly value="Administrador">
                        <div class="form-text text-danger small"><i class="fas fa-lock me-1"></i>El rol solo puede ser modificado por un administrador del sistema.</div>
                    </div>

                    <!-- SECCIÓN 2: Contraseña -->
                    <h5 class="text-warning mt-4 mb-3 border-bottom pb-2">
                        <i class="fas fa-key me-2"></i>Contraseña
                    </h5>

                    <div class="mb-3">
                        <label class="small">Nueva Contraseña</label>
                        <input type="password" id="new_password" class="form-control" placeholder="Escribe la nueva contraseña si deseas cambiarla" minlength="6">
                        <div class="form-text text-muted small">Mínimo 6 caracteres. Dejar en blanco para mantener la actual.</div>
                    </div>

                    <button type="submit" class="btn btn-info w-100 fw-bold py-3 mt-4">
                        <i class="fas fa-save me-2"></i>GUARDAR CAMBIOS
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    const _supabase = supabase.createClient('https://kcamvogialgzhtnztink.supabase.co', 'sb_publishable_KDacU7ubY2lYE6BAVvhOmA_qe1XUR2s');
    let emailOriginal = "";

    // 1. Obtener datos del usuario desde Supabase Auth
    async function obtenerPerfilUsuario() {
        const { data: { user }, error } = await _supabase.auth.getUser();

        if (error || !user) {
            alert("No se detectó una sesión activa. Por favor, inicia sesión.");
            return;
        }

        // Rellenar datos
        emailOriginal = user.email;
        $('#user_email').val(user.email);
        
        if (user.user_metadata && user.user_metadata.display_name) {
            $('#user_display_name').val(user.user_metadata.display_name);
        }

        if (user.app_metadata && user.app_metadata.role) {
            $('#user_role').val(user.app_metadata.role);
        }
    }

    // 2. Guardar modificaciones del formulario
    $('#profileForm').on('submit', async function(e) {
        e.preventDefault();
        
        const displayName = $('#user_display_name').val().trim();
        const nuevoEmail = $('#user_email').val().trim();
        const newPassword = $('#new_password').val();

        // Estructurar el objeto de actualización de Auth
        let datosActualizacion = {
            data: { display_name: displayName }
        };

        // Si el usuario modificó su correo, lo añadimos al payload
        if (nuevoEmail !== emailOriginal) {
            datosActualizacion.email = nuevoEmail;
        }

        // Si se digita un valor en la sección de contraseña
        if (newPassword) {
            datosActualizacion.password = newPassword;
        }

        const { data, error } = await _supabase.auth.updateUser(datosActualizacion);

        if (error) {
            alert("Error al actualizar los datos: " + error.message);
        } else {
            let mensaje = "¡Perfil actualizado correctamente!";
            if (nuevoEmail !== emailOriginal) {
                mensaje += "\nSe ha enviado un correo de confirmación a ambas direcciones para validar el nuevo email.";
            }
            alert(mensaje);
            $('#new_password').val(''); 
            obtenerPerfilUsuario(); 
        }
    });

    $(document).ready(obtenerPerfilUsuario);
</script>
</body>
</html>
