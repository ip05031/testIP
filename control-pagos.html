<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Pagos - FacturaSnap</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

    <style>
        body { background-color: #0f0f0f; color: #e0e0e0; font-family: 'Segoe UI', sans-serif; }
        .card { border: none; border-radius: 12px; background: #1e1e1e; margin-bottom: 1.5rem; }
        .header-app { border-bottom: 2px solid #0dcaf0; padding-bottom: 10px; margin-bottom: 25px; }
        .table { background-color: #1e1e1e; color: #e0e0e0; }
        .table-hover tbody tr { cursor: pointer; }
        .table-hover tbody tr:hover { background-color: #2a2a2a; }
        .status-badge { font-size: 0.8rem; padding: 5px 10px; border-radius: 20px; font-weight: bold; }
        .text-vencido { color: #ff4d4d !important; font-weight: bold; }
        .form-control, .form-select { background-color: #2a2a2a; border: 1px solid #444; color: #fff; }
        .form-control:focus, .form-select:focus { background-color: #333; color: #fff; border-color: #0dcaf0; box-shadow: none; }
        input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(1); }
        
        /* Estilos para el Drag & Drop de Archivos */
        .dropzone-area {
            border: 2px dashed #444;
            border-radius: 8px;
            padding: 25px;
            text-align: center;
            background: #252525;
            cursor: pointer;
            transition: border-color 0.3s;
        }
        .dropzone-area:hover { border-color: #0dcaf0; }
        
        /* Ajustes de tamaño y diseño para el panel lateral Maestro-Detalle */
        .offcanvas { background-color: #181818; width: 500px !important; border-left: 1px solid #2d2d2d; }
        .offcanvas-header { border-bottom: 1px solid #2d2d2d; }
        .table-panel { font-size: 0.85rem; background-color: #202020; }
    </style>
</head>

<body class="p-2 p-md-4">

    <div class="container-fluid">
        <div class="header-app d-flex justify-content-between align-items-center">
            <h2 class="m-0">
                <a href="index.html" class="text-decoration-none text-white">
                    <i class="fas fa-arrow-left me-2 fs-4 text-info"></i>
                </a>Control de Pagos
            </h2>
        </div>

        <div class="card shadow mb-4">
            <div class="card-body">
                <form id="filterForm" class="row g-3 align-items-end">
                    <div class="col-md-2">
                        <label class="small fw-bold text-info">Desde:</label>
                        <input type="date" id="filterDesde" class="form-control">
                    </div>
                    <div class="col-md-2">
                        <label class="small fw-bold text-info">Hasta:</label>
                        <input type="date" id="filterHasta" class="form-control">
                    </div>
                    <div class="col-md-3">
                        <label class="small fw-bold text-info">Proyecto:</label>
                        <select id="filterProyecto" class="form-select">
                            <option value="">Todos los proyectos</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label class="small fw-bold text-info">Proveedor:</label>
                        <select id="filterProveedor" class="form-select">
                            <option value="">Todos los proveedores</option>
                        </select>
                    </div>
                    <div class="col-md-2 d-flex gap-1">
                        <button type="submit" class="btn btn-info w-100 fw-bold">
                            <i class="fas fa-filter"></i> Filtrar
                        </button>
                        <button type="button" id="btnReset" class="btn btn-outline-secondary">
                            <i class="fas fa-undo"></i>
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <div class="card shadow">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-dark">
                            <tr>
                                <th>PO</th>
                                <th>Proyecto</th>
                                <th>Proveedor</th>
                                <th>Emisión</th>
                                <th>Vencimiento</th>
                                <th>Total</th>
                                <th>DTE / Factura</th>
                                <th class="text-center">Estado</th>
                            </tr>
                        </thead>
                        <tbody id="pagosBody">
                            <tr>
                                <td colspan="8" class="text-center p-4">Cargando información...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <div class="offcanvas offcanvas-end" tabindex="-1" id="panelDetalle" aria-labelledby="panelDetalleLabel">
        <div id="panelContentWrapper"></div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        // Configuración de Supabase
        const _supabase = supabase.createClient('https://kcamvogialgzhtnztink.supabase.co', 'sb_publishable_KDacU7ubY2lYE6BAVvhOmA_qe1XUR2s');

        let bsOffcanvas;
        let ordenesCache = []; 
        let archivosCargados = [];

        const fmtF = (f) => f ? f.split('-').reverse().join('/') : '-';

        // 1. Cargar Selects
        async function cargarCatalogos() {
            try {
                const [resProy, resProv] = await Promise.all([
                    _supabase.from('proyectos').select('id, nombre_proyecto').order('nombre_proyecto'),
                    _supabase.from('proveedores').select('id, nombre_comercial').order('nombre_comercial')
                ]);

                resProy.data?.forEach(p => $('#filterProyecto').append(`<option value="${p.id}">${p.nombre_proyecto}</option>`));
                resProv.data?.forEach(p => $('#filterProveedor').append(`<option value="${p.id}">${p.nombre_comercial}</option>`));
            } catch (err) {
                console.error("Error cargando catálogos:", err);
            }
        }

        // 2. Cargar Datos
        async function cargarPagos(filtros = {}) {
            $('#pagosBody').html('<tr><td colspan="8" class="text-center p-4">Buscando registros...</td></tr>');

            let query = _supabase
                .from('ordenes_compra')
                .select(`
                    id, 
                    numero_orden, 
                    fecha, 
                    fecha_vencimiento, 
                    total, 
                    estado, 
                    numero_factura_dte,
                    proveedores!inner ( nombre_comercial ),
                    proyectos!inner ( nombre_proyecto )
                `);

            if (filtros.desde) query = query.gte('fecha', filtros.desde);
            if (filtros.hasta) query = query.lte('fecha', filtros.hasta);
            if (filtros.proyecto) query = query.eq('proyecto_id', filtros.proyecto);
            if (filtros.proveedor) query = query.eq('proveedor_id', filtros.proveedor);

            query = query.order('fecha', { ascending: false });

            const { data, error } = await query;

            if (error) {
                $('#pagosBody').html(`<tr><td colspan="8" class="text-center text-danger p-4">Error: ${error.message}</td></tr>`);
                return;
            }

            ordenesCache = data || [];
            renderizarTabla(ordenesCache);
        }

        // 3. Dibujar Tabla Principal
        function renderizarTabla(data) {
            let html = '';
            const hoy = new Date().toISOString().split('T')[0];

            if (!data || data.length === 0) {
                html = '<tr><td colspan="8" class="text-center p-4">No se encontraron resultados</td></tr>';
            } else {
                data.forEach(p => {
                    let numStr = p.numero_orden ? p.numero_orden.toString().replace(/\D/g, '') : '000';
                    let poLabel = `PO - ${numStr.padStart(3, '0')}`;

                    const esPendiente = p.estado?.toLowerCase() === 'pendiente';
                    const esVencido = esPendiente && p.fecha_vencimiento < hoy;

                    let badgeClass = 'bg-secondary';
                    if (p.estado === 'Pagado') badgeClass = 'bg-success';
                    if (p.estado === 'Pendiente') badgeClass = 'bg-warning text-dark';

                    html += `
                        <tr onclick="verDetalleOrden(${p.id})">
                            <td class="fw-bold text-info">${poLabel}</td>
                            <td><small class="fw-bold">${p.proyectos?.nombre_proyecto || 'N/A'}</small></td>
                            <td>${p.proveedores?.nombre_comercial || 'N/A'}</td>
                            <td>${fmtF(p.fecha)}</td>
                            <td class="${esVencido ? 'text-vencido' : ''}">
                                ${fmtF(p.fecha_vencimiento)} 
                                ${esVencido ? '<i class="fas fa-exclamation-triangle ms-1"></i>' : ''}
                            </td>
                            <td class="fw-bold">$${p.total.toLocaleString('en-US', { minimumFractionDigits: 2 })}</td>
                            <td><small class="text-secondary">${p.numero_factura_dte || '---'}</small></td>
                            <td class="text-center"><span class="status-badge ${badgeClass}">${p.estado}</span></td>
                        </tr>`;
                });
            }
            $('#pagosBody').html(html);
        }

        // 4. UI/UX: Renderizar Vista Detalle (Con subtabla de items de la orden)
        async function verDetalleOrden(id) {
            const orden = ordenesCache.find(o => o.id === id);
            if (!orden) return;

            let numStr = orden.numero_orden ? orden.numero_orden.toString().replace(/\D/g, '') : '000';
            let poLabel = `PO - ${numStr.padStart(3, '0')}`;

            // Renderizado base del esqueleto del panel
            let htmlPanel = `
                <div class="offcanvas-header">
                    <h5 class="offcanvas-title fw-bold text-info" id="panelDetalleLabel">${poLabel}</h5>
                    <button type="button" class="btn-close text-reset" data-bs-dismiss="offcanvas" aria-label="Close"></button>
                </div>
                <div class="offcanvas-body">
                    <div class="d-flex gap-2 mb-4">
                        ${orden.estado?.toLowerCase() === 'pendiente' ? 
                            `<button class="btn btn-success w-50 fw-bold" onclick="abrirFormularioPago(${orden.id})">
                                <i class="fas fa-money-bill-wave me-2"></i> Pagar
                             </button>` : 
                            `<button class="btn btn-outline-success w-50 fw-bold" disabled>
                                <i class="fas fa-check-circle me-2"></i> Pagado
                             </button>`
                        }
                        <button class="btn btn-info w-50 fw-bold text-white" onclick="abrirSeccionDocumentos(${orden.id})">
                            <i class="fas fa-folder-open me-2"></i> Documentos
                        </button>
                    </div>

                    <h6 class="text-secondary text-uppercase small fw-bold mb-3">Información General</h6>
                    <div class="mb-2"><strong>Proyecto:</strong> <span class="text-white">${orden.proyectos?.nombre_proyecto || 'N/A'}</span></div>
                    <div class="mb-2"><strong>Proveedor:</strong> <span class="text-white">${orden.proveedores?.nombre_comercial || 'N/A'}</span></div>
                    <div class="mb-2"><strong>Fecha Emisión:</strong> <span class="text-white">${fmtF(orden.fecha)}</span></div>
                    <div class="mb-2"><strong>Fecha Vencimiento:</strong> <span class="text-white">${fmtF(orden.fecha_vencimiento)}</span></div>
                    <div class="mb-3"><strong>DTE / Factura Asociada:</strong> <span class="text-white">${orden.numero_factura_dte || '---'}</span></div>
                    
                    <div class="d-flex justify-content-between align-items-center bg-dark p-2 rounded mb-4">
                        <span class="fw-bold text-secondary">Monto Total:</span>
                        <span class="fs-5 fw-bold text-success">$${orden.total.toLocaleString('en-US', { minimumFractionDigits: 2 })}</span>
                    </div>

                    <h6 class="text-secondary text-uppercase small fw-bold mb-2">Detalle de Ítems (Productos/Servicios)</h6>
                    <div class="table-responsive rounded border border-secondary mb-3">
                        <table class="table table-sm table-panel mb-0 align-middle">
                            <thead class="table-group-divider">
                                <tr>
                                    <th>Descripción</th>
                                    <th class="text-center">Cant.</th>
                                    <th class="text-end">P. Unit</th>
                                    <th class="text-end">Subtotal</th>
                                </tr>
                            </thead>
                            <tbody id="itemsOrdenBody">
                                <tr><td colspan="4" class="text-center text-secondary p-2"><i class="fas fa-spinner fa-spin me-1"></i> Leyendo ítems...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>`;

            $('#panelContentWrapper').html(htmlPanel);
            bsOffcanvas.show();

            // Consulta asíncrona de la tabla hijo: detalle_orden
            try {
                const { data: detalles, error } = await _supabase
                    .from('detalle_orden')
                    .select('descripcion, cantidad, costo_unitario, subtotal')
                    .eq('orden_id', id);

                if (error) throw error;

                let htmlItems = '';
                if (!detalles || detalles.length === 0) {
                    htmlItems = '<tr><td colspan="4" class="text-center text-muted p-2">Sin ítems registrados</td></tr>';
                } else {
                    detalles.forEach(d => {
                        htmlItems += `
                            <tr>
                                <td><small>${d.descripcion || 'Sin descripción'}</small></td>
                                <td class="text-center">${d.cantidad}</td>
                                <td class="text-end">$${Number(d.costo_unitario).toFixed(2)}</td>
                                <td class="text-end fw-bold text-white">$${Number(d.subtotal).toFixed(2)}</td>
                            </tr>`;
                    });
                }
                $('#itemsOrdenBody').html(htmlItems);

            } catch (err) {
                console.error("Error consultando detalle_orden:", err);
                $('#itemsOrdenBody').html('<tr><td colspan="4" class="text-center text-danger p-2">No se pudieron cargar los ítems</td></tr>');
            }
        }

        // 5. UI/UX: Formulario de Pago (Limpio, sin botón archivar)
        function abrirFormularioPago(id) {
            const orden = ordenesCache.find(o => o.id === id);
            if (!orden) return;

            let numStr = orden.numero_orden ? orden.numero_orden.toString().replace(/\D/g, '') : '000';
            let poLabel = `PO - ${numStr.padStart(3, '0')}`;

            let htmlFormulario = `
                <div class="offcanvas-header">
                    <h5 class="offcanvas-title fw-bold text-success" id="panelDetalleLabel">Registrar Pago: ${poLabel}</h5>
                    <button type="button" class="btn-close text-reset" data-bs-dismiss="offcanvas" aria-label="Close"></button>
                </div>
                <div class="offcanvas-body">
                    <form id="paymentForm" onsubmit="procesarFormularioPago(event, ${orden.id})">
                        <div class="mb-3">
                            <label class="small fw-bold text-secondary">Total Obligatorio a Cancelar:</label>
                            <input type="text" class="form-control fw-bold text-success fs-5" value="$${orden.total.toLocaleString('en-US', { minimumFractionDigits: 2 })}" readonly>
                        </div>

                        <div class="mb-3">
                            <label class="small fw-bold text-info">Cuenta de Pago / Banco Origen:</label>
                            <select class="form-select" required>
                                <option value="" selected disabled>Seleccione una cuenta bancaria...</option>
                                <option value="1">Cuenta Corriente Agrícola (...4520)</option>
                                <option value="2">Cuenta de Ahorros Cuscatlán (...8812)</option>
                                <option value="3">Fondo Rotativo de Caja Chica</option>
                            </select>
                        </div>

                        <div class="mb-4">
                            <label class="small fw-bold text-info">Número de Referencia / Transacción:</label>
                            <input type="text" class="form-control" placeholder="Ej. TR-44102" required id="txtReferencia">
                        </div>

                        <div class="d-flex gap-2">
                            <button type="button" class="btn btn-outline-secondary w-50" onclick="verDetalleOrden(${orden.id})">
                                <i class="fas fa-chevron-left"></i> Volver
                            </button>
                            <button type="submit" class="btn btn-success w-50 fw-bold">
                                Confirmar Pago
                            </button>
                        </div>
                    </form>
                </div>`;

            $('#panelContentWrapper').html(htmlFormulario);
        }

        // 6. UI/UX: Nueva Pantalla del Área de Documentos (documentos_orden)
        async function abrirSeccionDocumentos(id) {
            const orden = ordenesCache.find(o => o.id === id);
            if (!orden) return;

            let numStr = orden.numero_orden ? orden.numero_orden.toString().replace(/\D/g, '') : '000';
            let poLabel = `PO - ${numStr.padStart(3, '0')}`;

            let htmlDocs = `
                <div class="offcanvas-header">
                    <h5 class="offcanvas-title fw-bold text-info" id="panelDetalleLabel"><i class="fas fa-file-invoice me-2"></i>Documentos: ${poLabel}</h5>
                    <button type="button" class="btn-close text-reset" data-bs-dismiss="offcanvas" aria-label="Close"></button>
                </div>
                <div class="offcanvas-body d-flex flex-column justify-content-between">
                    <div>
                        <h6 class="text-secondary text-uppercase small fw-bold mb-3">Archivos Vinculados de la Orden</h6>
                        
                        <div id="listaDocumentosDB" class="mb-4">
                            <div class="text-center p-3 text-secondary"><i class="fas fa-spinner fa-spin me-1"></i> Buscando expedientes...</div>
                        </div>

                        <hr class="border-secondary my-4">

                        <h6 class="text-secondary text-uppercase small fw-bold mb-2">Cargar Nuevo Documento</h6>
                        <div class="mb-3">
                            <label class="small text-muted mb-1">Tipo de Documento:</label>
                            <select id="tipoDocumentoCarga" class="form-select form-select-sm">
                                <option value="DTE / Factura Electrónica">DTE / Factura Electrónica</option>
                                <option value="Comprobante de Transferencia">Comprobante de Transferencia</option>
                                <option value="Nota de Remisión">Nota de Remisión</option>
                                <option value="Otros">Otros</option>
                            </select>
                        </div>

                        <div class="dropzone-area mb-2" onclick="$('#fileInput').click()">
                            <i class="fas fa-cloud-upload-alt text-info fs-4 mb-2"></i>
                            <p class="mb-0 small text-secondary">Presiona para examinar o arrastra el documento</p>
                            <input type="file" id="fileInput" multiple class="d-none" onchange="manejarArchivos(this.files)">
                        </div>
                        <ul class="list-group list-group-flush" id="listaArchivosNuevos"></ul>
                    </div>

                    <div class="d-flex gap-2 mt-4">
                        <button type="button" class="btn btn-outline-secondary w-100" onclick="verDetalleOrden(${orden.id})">
                            <i class="fas fa-chevron-left me-1"></i> Regresar al Detalle
                        </button>
                    </div>
                </div>`;

            $('#panelContentWrapper').html(htmlDocs);
            archivosCargados = []; // Reiniciar temporales

            // Consultar dinámicamente los documentos actuales en la tabla: documentos_orden
            try {
                const { data: docs, error } = await _supabase
                    .from('documentos_orden')
                    .select('id, tipo_documento, ruta_storage, created_at')
                    .eq('orden_id', id);

                if (error) throw error;

                let htmlLista = '<div class="list-group">';
                if (!docs || docs.length === 0) {
                    htmlLista += `
                        <div class="text-center p-4 bg-dark rounded border border-secondary text-muted">
                            <i class="fas fa-folder-open fs-4 d-block mb-2"></i>
                            <small>No hay documentos anexados todavía</small>
                        </div>`;
                } else {
                    docs.forEach(d => {
                        htmlLista += `
                            <div class="list-group-item bg-transparent border-secondary text-white d-flex justify-content-between align-items-center p-2">
                                <div class="text-truncate me-2">
                                    <span class="d-block small fw-bold text-info">${d.tipo_documento}</span>
                                    <span class="text-secondary style="font-size:0.75rem;"><i class="fas fa-paperclip me-1"></i>${d.ruta_storage.split('/').pop()}</span>
                                </div>
                                <a href="#" class="btn btn-sm btn-outline-info border-0" title="Ver documento"><i class="fas fa-external-link-alt"></i></a>
                            </div>`;
                    });
                }
                htmlLista += '</div>';
                $('#listaDocumentosDB').html(htmlLista);

            } catch (err) {
                console.error("Error consultando documentos_orden:", err);
                $('#listaDocumentosDB').html('<div class="alert alert-danger small">Error al conectar con el repositorio de documentos.</div>');
            }
        }

        // Manejadores de control de carga visual
        function manejarArchivos(files) {
            let tipo = $('#tipoDocumentoCarga').val();
            for (let file of files) {
                archivosCargados.push({ name: file.name, tipo: tipo });
            }
            actualizarListaArchivosNuevos();
        }

        function actualizarListaArchivosNuevos() {
            let listHtml = '';
            archivosCargados.forEach((doc, index) => {
                listHtml += `
                    <li class="list-group-item bg-transparent text-white border-secondary p-1 d-flex justify-content-between align-items-center small">
                        <span class="text-truncate"><i class="fas fa-file-alt text-warning me-2"></i>[${doc.tipo}] ${doc.name}</span>
                        <button type="button" class="btn btn-sm text-danger p-0 ms-2" onclick="eliminarArchivoTemp(${index})"><i class="fas fa-times"></i></button>
                    </li>`;
            });
            $('#listaArchivosNuevos').html(listHtml);
        }

        function eliminarArchivoTemp(index) {
            archivosCargados.splice(index, 1);
            actualizarListaArchivosNuevos();
        }

        // Acción final del Formulario de Pago
        async function procesarFormularioPago(e, id) {
            e.preventDefault();
            const numReferencia = $('#txtReferencia').val();

            const { error } = await _supabase.from('ordenes_compra').update({ 
                estado: 'Pagado',
                numero_factura_dte: numReferencia
            }).eq('id', id);

            if (error) {
                alert("Error: " + error.message);
            } else {
                bsOffcanvas.hide();
                const filtros = {
                    desde: $('#filterDesde').val(),
                    hasta: $('#filterHasta').val(),
                    proyecto: $('#filterProyecto').val(),
                    proveedor: $('#filterProveedor').val()
                };
                cargarPagos(filtros);
            }
        }

        // Eventos de los filtros globales
        $('#filterForm').on('submit', function (e) {
            e.preventDefault();
            const filtros = {
                desde: $('#filterDesde').val(),
                hasta: $('#filterHasta').val(),
                proyecto: $('#filterProyecto').val(),
                proveedor: $('#filterProveedor').val()
            };
            cargarPagos(filtros);
        });

        $('#btnReset').on('click', function () {
            $('#filterForm')[0].reset();
            cargarPagos();
        });

        $(document).ready(() => {
            bsOffcanvas = new bootstrap.Offcanvas(document.getElementById('panelDetalle'));
            cargarCatalogos();
            cargarPagos();
        });
    </script>
</body>
</html>
