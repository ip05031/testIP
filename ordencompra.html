<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mantenimiento - FacturaSnap</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        body { 
            background-color: #0f0f0f; 
            color: #e0e0e0; 
            font-family: 'Segoe UI', sans-serif; 
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card { 
            border: none; 
            border-radius: 12px; 
            background: #1e1e1e; 
            max-width: 500px;
            width: 90%;
        }
        .header-app { 
            border-bottom: 2px solid #0dcaf0; 
            padding-bottom: 10px; 
            margin-bottom: 25px; 
        }
        .icon-maintenance {
            font-size: 5rem;
            color: #ffc107;
            margin-bottom: 20px;
            display: block;
            text-align: center;
        }
        .btn-back {
            background-color: #0dcaf0;
            color: #000;
            font-weight: bold;
        }
        .btn-back:hover {
            background-color: #0baccc;
            color: #000;
        }
    </style>
</head>
<body class="p-4">

<div class="container text-center">
    <div class="card p-5 shadow-lg mx-auto">
        <div class="header-app mb-4">
            <h2 class="m-0 text-white">FacturaSnap</h2>
        </div>

        <i class="fas fa-tools icon-maintenance animate__animated animate__pulse animate__infinite"></i>
        
        <h3 class="text-info mb-3">Opción en Mantenimiento</h3>
        
        <p class="text-secondary mb-4">
            Estamos trabajando para mejorar esta sección. <br> 
            Estará disponible para ti muy pronto.
        </p>

        <div class="d-grid">
            <a href="index.html" class="btn btn-back py-2 shadow-sm">
                <i class="fas fa-arrow-left me-2"></i>VOLVER AL INICIO
            </a>
        </div>
    </div>
    
    <div class="mt-4">
        <span class="badge bg-secondary opacity-50">Versión 2.0.4 - Sistema de Gestión</span>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
</body>
</html>
